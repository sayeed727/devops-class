cluster info
  MyEC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: ami-0c55b159cbfafe1f0 # Replace with your region's Amazon Linux 2/2023 AMI
      InstanceType: t2.micro
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          # Update the system
          yum update -y
          # Install Apache HTTP Server
          yum install -y httpd
          # Start and enable Apache so it runs on boot
          systemctl start httpd
          systemctl enable httpd
          # Create a simple test webpage with the instance IDwq

          echo "<h1>Hello World from EC2 instance: ${AWS::InstanceId}</h1>" > /var/www/html/index.html
